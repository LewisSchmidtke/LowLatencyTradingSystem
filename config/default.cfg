# ---------- Run ----------
run.duration_seconds=30
run.seed=777

# ---------- Order flow simulator ----------
sim.messages_per_second=200000
sim.weight_passive=70
sim.weight_aggressive=10
sim.weight_cancel=20
sim.max_live_orders=5000
sim.passive_depth_ticks=20
sim.max_order_qty=500
sim.mid_move_percent=5

# ---------- Instruments ----------
instruments.count=2
instrument.0.symbol=AAPL
instrument.0.min_price=50.00
instrument.0.max_price=150.00
instrument.0.start_mid=100.00
instrument.1.symbol=MSFT
instrument.1.min_price=300.00
instrument.1.max_price=500.00
instrument.1.start_mid=400.00

# ---------- Exchange ----------
exchange.max_orders_per_instrument=200000

#  ---------- Strategy ----------
strategy.quote_qty=100
strategy.half_spread_ticks=3
strategy.skew_ticks_per_100_shares=1
strategy.requote_threshold_ticks=1
strategy.max_position=1000

# ---------- Risk ----------
risk.max_order_qty=500
risk.max_position=2000
risk.max_open_orders=8
risk.max_notional=1000000.00
risk.price_collar_ticks=50
risk.orders_per_second=1000
risk.burst=100

# ---------- Threads (-1 means: do not pin) ----------
cores.exchange=1
cores.market_data=2
cores.trading=3
cores.logger=-1

#  ---------- Logging ----------
log.file=llt.log
log.level=info